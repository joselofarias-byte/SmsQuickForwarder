name: Android CI

on:
  push:
    branches: [main, feat/spanish-localization]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Audit Spanish resources
        run: python3 scripts/check_spanish.py
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build validation APK (not an official release)
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SMS-fwd-es-validacion-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
